# Serves the Elfie app and forwards the Supabase APIs to the backend containers,
# so the app and its backend share one address (and one port to expose).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS. Upstreams are looked up per request (via variables
  # below), so a restarted backend container never leaves nginx with a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # --- Supabase APIs (same paths the hosted Supabase gateway uses) -----------

  location /auth/v1/ {
    set $auth_upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth_upstream;
  }

  location /rest/v1/ {
    set $rest_upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_upstream;
  }

  # Live updates between family members (websocket). Realtime reads its tenant
  # from the Host header, which nginx sets to the upstream name below.
  location /realtime/v1/ {
    set $realtime_upstream http://realtime-dev.supabase-realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $realtime_upstream;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # --- The app ---------------------------------------------------------------

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the shell — it points at the current build
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Single page app: every unknown path serves the shell
  location / {
    try_files $uri $uri/ /index.html;
  }
}
